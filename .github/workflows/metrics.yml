name: Generate Metrics

on:
  schedule:
    # Todo dia às 04:00 UTC (01:00 em Brasília)
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # O GITHUB_TOKEN padrão é escopado apenas a este repositório, então o
      # metrics não consegue enumerar os outros repos do usuário e gera SVGs
      # vazios. É necessário um PAT (classic, escopo public_repo + read:user)
      # salvo como o segredo METRICS_TOKEN.
      - name: Verifica se o METRICS_TOKEN existe
        id: guard
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::warning::Segredo METRICS_TOKEN ausente — geração ignorada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Visão geral (atividade e repositórios)
        if: steps.guard.outputs.ok == 'true'
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ikeda7
          base: header, activity, repositories
          config_timezone: America/Sao_Paulo
          config_theme: dark
          repositories_forks: no

      - name: Linguagens mais usadas
        if: steps.guard.outputs.ok == 'true'
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ikeda7
          base: ""
          config_timezone: America/Sao_Paulo
          config_theme: dark
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
